name: Release Obsidian plugin

# Runs when a pull request is merged into main (a push to main). If manifest.json's version has no
# release yet, it builds from that exact commit and creates a DRAFT release with main.js and
# manifest.json attached. Review the generated notes and click Publish; publishing is what creates
# the git tag (named exactly like the version, no "v") on the commit below.
#
# Everything happens in this one workflow on purpose: events triggered by the built-in GITHUB_TOKEN
# (such as a tag it creates) do not start other workflow runs, so a separate tag-triggered workflow
# would never fire.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # also fetches tags

      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::manifest.json version '$version' must be plain x.y.z (no 'v' prefix)."
            exit 1
          fi
          existing=false
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then existing=true; fi
          if gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -Fxq "$version"; then existing=true; fi
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ "$existing" = true ]; then
            echo "Release $version already exists (tag or release/draft); nothing to do."
          fi

      - name: Use Node.js
        if: steps.version.outputs.existing != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.existing != 'true'
        run: npm ci

      - name: Type check
        if: steps.version.outputs.existing != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.version.outputs.existing != 'true'
        run: npm test

      - name: Lint
        if: steps.version.outputs.existing != 'true'
        run: npm run lint

      - name: Build plugin
        if: steps.version.outputs.existing != 'true'
        run: npm run build

      - name: Generate artifact attestation
        if: steps.version.outputs.existing != 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json

      - name: Create draft release
        if: steps.version.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title="$VERSION" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            main.js manifest.json
